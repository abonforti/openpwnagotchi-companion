<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- viewport-fit=cover is what lets env(safe-area-inset-*) return anything
         other than zero. Without it the layout sits under the Dynamic Island. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!-- Standalone mode when added to the Home Screen. iOS still reads the
         apple-* meta tags, not only the manifest. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Companion" />

    <meta name="theme-color" content="#0e1116" />
    <meta
      name="description"
      content="Companion for pwnagotchi, served from your own unit."
    />

    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>openpwnagotchi companion</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
