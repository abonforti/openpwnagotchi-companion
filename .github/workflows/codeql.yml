name: CodeQL

# Static analysis for the vulnerability classes this project actually has:
# the plugin serves files from disk over HTTP (path traversal), shells out to
# reboot and shutdown (command injection), builds an SSLContext, and binds
# sockets to addresses taken from configuration. That last one is decision D5
# in machine-checkable form - py/bind-socket-all-network-interfaces is exactly
# the "never bind 0.0.0.0" rule.
#
# Query suite: the default one, on purpose. security-extended and
# security-and-quality add style and quality queries that produce noise on a
# project this size, and a noisy gate gets ignored - which is why the language
# check was removed (SPEC.md 5.1). Widen it only if the default proves too quiet.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, so a newly published query reaches existing code without waiting
    # for someone to touch the file it applies to.
    - cron: "37 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyse
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}
