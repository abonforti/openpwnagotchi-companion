[pytest]
# The plugin is tested without a pwnagotchi installation: tests/conftest.py puts
# tests/fakes/pwnagotchi_stub/ on sys.path before plugin.companion is imported.
testpaths = tests
python_files = test_*.py

# Branch coverage, not line coverage: `if a and b` has four outcomes, not one,
# and the branch that never ran is the one that fails on the device (SPEC 10.7).
#
# The gate itself - --cov-fail-under=100 - is deliberately NOT here yet. The
# plugin is currently signatures and docstrings, so the gate would fail every
# run and tell nobody anything. Turn it on in the same commit that lands the
# implementation, and note that `# pragma: no cover` is banned outright: CI greps
# for it, because a gate anyone can opt out of is not a gate.
addopts =
    --cov=plugin
    --cov-branch
    --cov-report=term-missing
    --strict-markers
    -ra

# A warning from the plugin is a defect in the making on a device nobody watches.
#
# ResourceWarning is reported rather than fatal: an unclosed socket surfaces
# whenever the garbage collector next runs, so pytest attributes it to an
# arbitrary later test and the suite goes intermittently red in a place that has
# nothing to do with the leak. Read them in the output, do not trust which test
# they land on.
filterwarnings =
    error
    default::DeprecationWarning
    default::ResourceWarning
