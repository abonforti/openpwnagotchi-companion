name: CI

# The hard gate. Local hooks and review agents catch more, and catch it earlier,
# but they can all be skipped by whoever is in a hurry. This cannot: master
# requires these checks to pass before a pull request can merge.
#
# Jobs are added as the things they check come into existence. Today that is the
# protocol contract and repository hygiene; the plugin and frontend jobs arrive
# with the plugin and the frontend.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The version the device actually ships. Measured on a unit running jayofelony
  # 2.9.5.6: /opt/.pwn/lib/python3.13, Python 3.13.5. This used to say 3.11 and
  # cite the device for it, which was wrong: 3.11 is the floor upstream declares
  # in requires-python (SPEC section 11, F21), not what the image installs. Every
  # green run before this one was a statement about an interpreter nobody runs.
  PYTHON_VERSION: "3.13"
  # 22, not 20. jsdom brings undici, which calls webidl.util.markAsUncloneable,
  # a function the Node 20 line does not have: on 20 the vitest workers fail to
  # start at all, with an error that names undici rather than the Node version.
  # 22 is also what the development host runs, so a green run here now means the
  # same thing a green run there does.
  NODE_VERSION: "22"

jobs:
  schemas:
    name: Protocol schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install jsonschema
        run: pip install --disable-pip-version-check jsonschema

      - name: Validate docs/schemas
        run: python .github/check_schemas.py

  protocol-types:
    name: Generated types in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # frontend/src/lib/protocol.ts is generated from docs/schemas and committed.
      # If the two drift, the plugin and the PWA stop agreeing about the wire
      # format, which is exactly the class of bug the schema-first design exists
      # to prevent - so this is a build failure, not a warning.
      - name: Check protocol.ts against the schemas
        run: node tools/gen-protocol-types.mjs --check

  pinned-facts:
    name: Pinned facts still hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # No flags: the default mode checks the pinned facts against
      # `verified_against`, a fixed tag recorded in pinned_symbols.json. Nothing
      # upstream does can turn this red, so a failure here means this repository
      # changed a fact without re-verifying it, or lost the tag it verifies
      # against - a defect worth blocking a merge for (SPEC.md 11.2). This is
      # the "has this repository stayed honest" question; --latest asks the
      # different one, "has upstream moved", and stays out of CI in
      # upstream-drift.yml because an upstream release is not a reason for
      # somebody's unrelated pull request to go red. Exit 0 is clean, 1 means a
      # fact drifted, anything above 1 means the check itself could not run -
      # all three fail this job, because a check that could not run has not
      # passed.
      - name: Check the pinned facts against verified_against
        run: python .github/check_pinned_facts.py

  workflows:
    name: Workflow syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # actionlint has no first-party GitHub Action, so the binary is fetched by
      # hand: a pinned release, verified against its published checksum before
      # anything in the archive runs (SPEC 5.1.4, issue #180).
      - name: Install actionlint
        run: |
          set -euo pipefail
          curl -sSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/actionlint

      # release.yml runs only on a pushed tag, the worst possible moment to
      # find a typo (SPEC 5.1.4), so every workflow file is checked here, on
      # every pull request, rather than waiting for the one run that matters.
      - name: Lint the workflows
        run: actionlint -color

  plugin:
    name: Plugin tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The device's version first, then the floor upstream declares in
        # requires-python, because somebody can be on an older image. Spelled out
        # rather than read from env: the env context is not available inside
        # strategy. fail-fast is off so a break on one is not hidden by the other
        # going red first.
        python: ["3.13", "3.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: pip install --disable-pip-version-check -r tests/requirements.txt

      # No pwnagotchi installation: tests/fakes/pwnagotchi_stub stands in and
      # exposes exactly the symbols pinned in SPEC section 11, so reaching for
      # an API the real fork does not have fails here rather than on a device.
      #
      # --cov-fail-under lives on this invocation rather than in pytest.ini
      # because a targeted local run is legitimately below the floor and must
      # not be red for it (see the comment there). This is the whole suite, so
      # here the number means something.
      - name: Run the suite
        run: python -m pytest --cov-fail-under=85

      # The step above fails the run below 85%. This is the other half of
      # SPEC 10.7: it compares the run against the figure recorded in
      # .github/coverage-baseline.json and warns on a fall that stays above the
      # floor, which a flat threshold lets through in silence. It also restates
      # the floor, so bypassing --cov-fail-under does not bypass the gate.
      - name: Coverage floor and baseline
        run: python .github/check_coverage.py plugin

      # The plugin must at least parse under the interpreter the device runs.
      - name: Byte-compile the plugin
        run: python -m compileall -q plugin/

      # And it must be free of the defects parsing cannot see. E and F only:
      # pycodestyle errors and the whole of pyflakes, which is where the
      # undefined name on an untaken error path lives. Configuration and the
      # argument for that selection are in ruff.toml.
      - name: Lint the plugin, the tooling, the tests and the gate scripts
        # The pre-commit hook is Python without the extension, so it has to be
        # named: a directory would not pick it up (issue #216).
        run: python -m ruff check plugin/ tools/ tests/ .github/*.py .githooks/pre-commit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci, never npm install: it installs exactly the committed lock and
      # fails if package.json and the lock disagree, so CI cannot silently
      # resolve a different tree than the one that was reviewed.
      - name: Install
        run: npm ci

      # Three checks that fail for different reasons and are worth keeping
      # apart: svelte-check reads the components, tsc reads everything else,
      # and a component can typecheck while its markup does not.
      - name: Check components
        run: npm run check

      - name: Typecheck
        run: npm run typecheck

      # With coverage, because the SPEC 10.7 thresholds are what make the gate a
      # gate. Run locally as `npm test` for speed; here the numbers are the
      # point, and a threshold nothing measures is a comment.
      - name: Test
        run: npm run test:coverage

      # The other half of SPEC 10.7, as in the plugin job: the vitest thresholds
      # fail below 85%, this reports a fall that stays above it. The path is
      # relative because this job runs in frontend/; the script resolves the
      # repository from its own location, so it does not care where it is run
      # from. python3, not python: no setup-python step runs in this job and
      # python3 is the name the runner image guarantees.
      - name: Coverage floor and baseline
        run: python3 ../.github/check_coverage.py frontend

      # Last, because a build that succeeds on code that does not typecheck is
      # not information worth having.
      - name: Build
        run: npm run build

      # SPEC 2.15.1: script-src 'self' covers an external script and does
      # nothing for an inline one. That is a property of today's build
      # configuration, not of the tools, so it is asserted against the actual
      # output rather than trusted (issue #141). python3, not python: no
      # setup-python step runs in this job.
      - name: No inline script in the built page
        run: python3 ../.github/check_no_inline_script.py

      # SPEC 5.1.3: form is checked mechanically instead of by hand, the way
      # the plugin side has run ruff since the beginning. Last, like the
      # plugin's own lint step, because a formatting complaint is not worth
      # reading before the code it describes is known to work.
      - name: Formatting
        run: npm run format:check

  e2e:
    name: End-to-end (Chromium, WebKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # The cache key has to be the exact Playwright version, not the lockfile
      # hash: browser revisions are pinned to that version, and a cache restored
      # for another one leaves Playwright downloading them again anyway.
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      # The apt packages WebKit links against live outside ~/.cache and are not
      # in the cache, so they are installed even on a hit. This is the cheap half
      # of the step above; the browser downloads are the slow half.
      - name: Install browser system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      # Builds dist/ and serves it through the webServer in playwright.config.ts.
      # The suite runs against what ships, not against the dev server.
      - name: Run the end-to-end suite
        run: npm run test:e2e

      # Screenshots are evidence for a human, never a baseline: this runner is
      # amd64 and the review host is arm64, so a shared baseline would fail on
      # font rendering alone (SPEC 10.5). Uploaded on failure too, which is when
      # somebody actually wants to look at them.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-screenshots
          path: frontend/test-results/
          if-no-files-found: warn
          retention-days: 14

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Generic credential material only. The owner-specific denylist is held
      # outside the repository by design, so that check runs in the local
      # pre-commit hook and cannot run here. A green result here is not proof
      # that a diff is safe to publish.
      - name: Secret scan
        run: python .github/check_secrets.py

      # Everything under frontend/public is copied verbatim into dist/ and
      # served by the unit, so a stray file there is published rather than
      # untidy. An agent once left a copy of frontend/src/ in it, fixtures and
      # all, and only a careful reading of `git status` caught it (#117). The
      # inventory is exact in both directions: an extra file and a missing one
      # both fail.
      - name: Shipped directories hold only what they declare
        run: python .github/check_shipped_files.py

      # Every ban scan below reads three outcomes, not two: `git grep` exits 0 on a
      # match, 1 when nothing matched, and 128 when it cannot compile the pattern or
      # read the tree. The `if git grep ...; then fail; fi` shape these used to have
      # collapsed the last two, so a pattern that stopped compiling turned its own ban
      # off and printed the clean line (SPEC 13). A gate that cannot run must fail.
      #
      # SPEC 10.5 rules out screenshot baselines outright, so the assertion that
      # would create one is banned rather than discouraged. Without this, the
      # first `toHaveScreenshot` commits a baseline that CI can only fail on.
      - name: No screenshot baselines
        run: |
          git grep -n -E 'toHaveScreenshot|toMatchSnapshot' -- 'frontend/tests' && status=0 || status=$?
          case "$status" in
            0) echo "::error::screenshot baselines are banned (SPEC.md 10.5)." ; exit 1 ;;
            1) echo "no screenshot baselines found" ;;
            *) echo "::error::the scan itself failed (git grep exit $status); this is not a clean result." ; exit 1 ;;
          esac

      # The 85% branch-coverage floor is only meaningful if nobody can opt out of
      # it, so the opt-out is banned outright rather than discouraged. SPEC 10.7:
      # a lower floor makes this rule more important, not less, because an
      # opt-out plus a floor is a number that means nothing.
      - name: No coverage exclusions
        run: |
          git grep -n -E 'pragma:[[:space:]]*no cover' -- '*.py' && status=0 || status=$?
          case "$status" in
            0) echo "::error::'# pragma: no cover' is banned (SPEC.md 10.7)." ; exit 1 ;;
            1) echo "no coverage exclusions found" ;;
            *) echo "::error::the scan itself failed (git grep exit $status); this is not a clean result." ; exit 1 ;;
          esac

      # Svelte escapes {...} by default, so the safe path is the default one and
      # {@html} is the only way to leave it. Every string this app renders that a
      # stranger chose - SSIDs, peer names, faces, log lines - would go through it
      # (SPEC 4.5.3). Banned outright rather than reviewed case by case, because a
      # reviewer who is tired is exactly the failure this protects against.
      #
      # The pattern is the tag rather than `{@html`, because `{ @html x}` compiles
      # just as well and a formatter is enough to produce it. `@html` means nothing
      # else in this tree, so matching it alone costs no false positives and cannot
      # be spaced around.
      #
      # This catches the Svelte construct and only that. The other two rules of
      # 4.5.3, handlers bound rather than built as markup and context-appropriate
      # escaping, have no gate: a green hygiene job is not the escaping rule
      # enforced, it is one sink closed.
      - name: No unescaped markup
        run: |
          git grep -n -E '@html' -- 'frontend/src/*' && status=0 || status=$?
          case "$status" in
            0) echo "::error::'{@html}' is banned (SPEC.md 4.5.3)." ; exit 1 ;;
            1) echo "no unescaped markup found" ;;
            *) echo "::error::the scan itself failed (git grep exit $status); this is not a clean result." ; exit 1 ;;
          esac
