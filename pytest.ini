[pytest]
# The plugin is tested without a pwnagotchi installation: tests/conftest.py puts
# tests/fakes/pwnagotchi_stub/ on sys.path before plugin.companion is imported.
testpaths = tests
python_files = test_*.py

# Branch coverage, not line coverage: `if a and b` has four outcomes, not one,
# and the branch that never ran is the one that fails on the device (SPEC 10.7).
#
# 85 is the floor the build fails below, not the target: SPEC 10.7 is explicit
# that writing exactly enough tests to reach it and stopping is a misreading.
# The floor alone would let a fall from 99 to 86 pass in silence, so the JSON
# report feeds .github/check_coverage.py, which compares the run against the
# figure recorded in .github/coverage-baseline.json and warns on a drop that
# stays above the line. `# pragma: no cover` is banned outright and CI greps for
# it, because a gate anyone can opt out of is not a gate.
#
# The floor itself is not set here. CLAUDE.md prescribes running locally only
# the tests a change touches, and a partial run is legitimately far below 85%:
# a --cov-fail-under in addopts makes that documented workflow exit non-zero on
# every invocation, which teaches everyone to pass --no-cov and then there is no
# gate at all. It lives on the CI invocation instead (.github/workflows/ci.yml,
# "Run the suite"), the only place the whole suite runs and so the only place
# the number means anything. --cov-report=json stays, because check_coverage.py
# is invoked by CI alone and a partial report written locally is never read.
addopts =
    --cov=plugin
    --cov-branch
    --cov-report=term-missing
    --cov-report=json
    --strict-markers
    -ra

# A warning from the plugin is a defect in the making on a device nobody watches.
#
# ResourceWarning is reported rather than fatal: an unclosed socket surfaces
# whenever the garbage collector next runs, so pytest attributes it to an
# arbitrary later test and the suite goes intermittently red in a place that has
# nothing to do with the leak. Read them in the output, do not trust which test
# they land on.
filterwarnings =
    error
    default::DeprecationWarning
    default::ResourceWarning
